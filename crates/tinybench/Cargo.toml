[package]
name = "tinybench"
version = "0.1.0"
edition = "2024"

[features]
default = ["gecko/rendersink-blackbox"]
jit-stats = ["gecko/jit-stats"]
jit-bench = ["gecko/frame-timings"]

[[bin]]
name = "jit_bench"
required-features = ["jit-bench"]

[dependencies]
gecko = { path = "../gecko" }
image = { path = "../image" }
clap = { version = "4.6.0", features = ["derive"] }
