[package]
name = "gecko"
version = "0.1.0"
edition = "2024"

[features]
default = ["jit"]
hooks = []
hooks-mut-traps = ["hooks"]
# Enable the WAV file audio sink
audio-wav-dump = ["dep:hound"]
# Cranelift JIT for Gekko
jit = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-native",
    "dep:region",
]
jit-stats = ["jit", "dep:backtrace"]
# Run both interpreter and JIT for every draw call, reports drift
vtx-jit-validate = ["jit", "gx-stats"]
fps-counter = []
gx-stats = []
profile = ["dep:backtrace", "dep:windows-sys"]
# Enables std::hint::black_box inside `EmptyRenderSink::exec`
rendersink-blackbox = []
hotpath = ["dep:hotpath", "hotpath/hotpath"]

[build-dependencies]
chipi-build = "0.9.1"

[dependencies]
chapa = "0.1.2"
dff = { path = "../dff" }
tracing = "0.1.44"
image = { path = "../image", default-features = false }
disasm = { path = "../disasm" }
glam = { version = "0.32.1", features = ["bytemuck"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
twox-hash = "2.1.2"
crossbeam-channel = "0.5.15"
hound = { version = "3.5.1", optional = true }
multiversion = "0.8.0"
rustc-hash = "2.1.2"
smallvec = "1.15.1"
crc32fast = "1.5.0"
zerocopy = { version = "0.8.48", features = ["derive"] }
zstd = "0.13.3"
cranelift-codegen = { version = "0.134.0", optional = true }
cranelift-frontend = { version = "0.134.0", optional = true }
cranelift-jit = { version = "0.134.0", optional = true }
libc = "0.2.186"
region = { version = "3.0.2", optional = true }
cranelift-module = { version = "0.134.0", optional = true }
cranelift-native = { version = "0.134.0", optional = true }
backtrace = { version = "0.3.76", optional = true }
hotpath = { version = "0.16.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
], optional = true }
