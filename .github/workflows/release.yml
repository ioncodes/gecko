name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGES: -p debugger -p multitool -p gecko-app -p tinyapp -p fifoplayer
  BINARIES: tinyapp debugger multitool gecko fifoplayer

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            dbg_suffix: linux-dbg-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
            dbg_suffix: linux-dbg-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            dbg_suffix: windows-dbg-x86_64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            suffix: windows-arm64
            dbg_suffix: windows-dbg-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Init submodules
        run: git submodule update --init --depth 1 --recursive submodules/chipi-spec submodules/solstice

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libasound2-dev

      - name: Install mold linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y mold
          echo 'RUSTFLAGS=-C link-arg=-fuse-ld=mold' >> $GITHUB_ENV

      - name: Patch Cargo.toml for CI builds
        shell: bash
        run: |
          perl -pi -e 's/^#panic = "abort"$/panic = "abort"/' Cargo.toml
          perl -pi -e 's/^#codegen-units = 1$/codegen-units = 1/' Cargo.toml

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }} ${{ env.PACKAGES }}

      - name: Build (dev profile, with tracing output)
        run: cargo build --profile dev --target ${{ matrix.target }} ${{ env.PACKAGES }}

      - name: Package artifacts
        shell: bash
        run: |
          EXT=""
          [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"

          mkdir -p artifacts

          package() {
            local profile=$1 suffix=$2 staging=$3
            mkdir -p "$staging"
            for bin in $BINARIES; do
              cp "target/${{ matrix.target }}/$profile/$bin$EXT" "$staging/"
            done
            cp LICENSE README.md "$staging/"
            (cd "$staging" && 7z a "../artifacts/gecko-$suffix.zip" *)
          }

          package release "${{ matrix.suffix }}" staging-rel
          package debug   "${{ matrix.dbg_suffix }}" staging-dbg

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: artifacts/*

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Init submodules
        run: git submodule update --init --depth 1 --recursive submodules/chipi-spec submodules/solstice

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-universal-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-universal-

      - name: Patch Cargo.toml for CI builds
        shell: bash
        run: |
          perl -pi -e 's/^#panic = "abort"$/panic = "abort"/' Cargo.toml
          perl -pi -e 's/^#codegen-units = 1$/codegen-units = 1/' Cargo.toml

      - name: Build (release, both arches)
        run: |
          cargo build --release --target aarch64-apple-darwin ${{ env.PACKAGES }}
          cargo build --release --target x86_64-apple-darwin  ${{ env.PACKAGES }}

      - name: Build (dev profile, both arches)
        run: |
          cargo build --profile dev --target aarch64-apple-darwin ${{ env.PACKAGES }}
          cargo build --profile dev --target x86_64-apple-darwin  ${{ env.PACKAGES }}

      - name: Lipo + package universal binaries
        shell: bash
        run: |
          mkdir -p artifacts

          package() {
            local profile=$1 suffix=$2 staging=$3
            mkdir -p "$staging"
            for bin in $BINARIES; do
              lipo -create \
                "target/aarch64-apple-darwin/$profile/$bin" \
                "target/x86_64-apple-darwin/$profile/$bin" \
                -output "$staging/$bin"
            done
            cp LICENSE README.md "$staging/"
            (cd "$staging" && 7z a "../artifacts/gecko-$suffix.zip" *)
          }

          package release macos-universal staging-rel
          package debug   macos-dbg-universal staging-dbg

      - name: Verify universal binaries
        run: lipo -info staging-rel/tinyapp

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-macos-universal
          path: artifacts/*

  release:
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete previous release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete release --cleanup-tag --yes --repo ${{ github.repository }} || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release
          target_commitish: ${{ github.sha }}
          name: Release (master)
          generate_release_notes: true
          files: artifacts/*