gcn_library = "/path/to/gamecube/games"
wii_library = "/path/to/wii/games"
system_dir = "/path/to/system"
dsp_rom = "/path/to/dsp_rom.bin"
dsp_coef = "/path/to/dsp_coef.bin"
ipl = "/path/to/IPL.bin"

cpu_mode = "jit"            # jit | interpreter
theme = "system"            # system | light | dark
skip_ipl = true
upscale = 1                 # internal resolution multiplier, 1-4

[input]
gamepads = true

# Button names: south, east, west, north, l1, r1, l2, r2, l3, r3,
# start, select, guide, dpad_up, dpad_down, dpad_left, dpad_right, touchpad

[input.gc]
a = "south"
b = "west"
x = "east"
y = "north"
start = "start"
z = "r1"
invert_stick_x = false
invert_stick_y = false
invert_cstick_x = false
invert_cstick_y = false
deadzone = 0.12

[input.wii]
a = "south"
b = "r2"
one = "west"
two = "north"
plus = "start"
minus = "select"
home = "guide"
nunchuk_c = "l1"
nunchuk_z = "l2"
shake = "r1"                # or "none"
recenter = "r3"
pointer = "auto"            # auto | gyro | stick | touchpad | mouse
pointer_sensitivity = 1.0
sideways = false
stick_dpad = true
invert_nunchuk_x = false
invert_nunchuk_y = false
invert_stick_dpad_x = false
invert_stick_dpad_y = false
invert_pointer_x = false
invert_pointer_y = false
deadzone = 0.12
