gcn_library = "/path/to/gamecube/games"
wii_library = "/path/to/wii/games"
system_dir = "/path/to/system"
dsp_rom = "/path/to/dsp_rom.bin"
dsp_coef = "/path/to/dsp_coef.bin"
ipl = "/path/to/IPL.bin"

cpu_mode = "jit"            # jit | interpreter
theme = "system"            # system | light | dark
skip_ipl = true
upscale = 1                 # internal resolution multiplier, 1-4

[input]
gamepads = true

# Button names: south, east, west, north, l1, r1, l2, r2, l3, r3,
# start, select, guide, dpad_up, dpad_down, dpad_left, dpad_right, touchpad

[input.gc]
a = "south"
b = "west"
x = "east"
y = "north"
start = "start"
z = "r1"
invert_stick_x = false
invert_stick_y = false
invert_cstick_x = false
invert_cstick_y = false
deadzone = 0.12

[input.wii]
a = "south"
b = "r2"
one = "west"
two = "north"
plus = "start"
minus = "select"
home = "guide"
nunchuk_c = "l1"
nunchuk_z = "l2"
shake = "r1"                # or "none"
recenter = "r3"
pointer = "auto"            # auto | gyro | stick | touchpad | mouse
pointer_sensitivity = 1.0
sideways = false
stick_dpad = true
invert_nunchuk_x = false
invert_nunchuk_y = false
invert_stick_dpad_x = false
invert_stick_dpad_y = false
invert_pointer_x = false
invert_pointer_y = false
deadzone = 0.12

[keyboard]

# Key names: a-z, 0-9, up, down, left, right, space, enter, tab, escape,
# backspace, delete, insert, home, end, page_up, page_down, caps_lock,
# shift_left, shift_right, ctrl_left, ctrl_right, alt_left, alt_right,
# super_left, super_right, minus, equal, comma, period, slash, semicolon,
# quote, backquote, backslash, bracket_left, bracket_right, f1-f12,
# numpad_0-numpad_9, numpad_enter, numpad_add, numpad_subtract,
# numpad_multiply, numpad_divide, numpad_decimal

[keyboard.gc]
stick_up = "up"
stick_down = "down"
stick_left = "left"
stick_right = "right"
a = "x"
b = "z"
x = "c"
y = "v"
start = "enter"
l = "a"
r = "s"
z = "d"
dpad_up = "i"
dpad_down = "k"
dpad_left = "j"
dpad_right = "l"

[keyboard.wii]
one = "1"
two = "2"
plus = "equal"
minus = "minus"
home = "home"
dpad_up = "up"
dpad_down = "down"
dpad_left = "left"
dpad_right = "right"
shake = "shift_left"
nunchuk_up = "w"
nunchuk_down = "s"
nunchuk_left = "a"
nunchuk_right = "d"
nunchuk_z = "q"
nunchuk_c = "e"

[keyboard.hotkeys]
pause = "space"
uncapped = "tab"
fullscreen = "f10"
overlay = "f11"
screenshot = "f12"
